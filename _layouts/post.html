---
layout: "wrapper"
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/img/logo.ico">
    <!-- <link rel="stylesheet" href= "style.css" > -->
      <!-- background color in body controls the color of the Wrapper. -->

    <style>
        body 
        {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #D3D3D3;
            color: #000;
            font-size: 18px
        }


        .container 
        {
            max-width: 1100px;
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

/* Tablet and Small Desktops */
@media screen and (max-width: 768px) 
{
    body {
        font-size: 16px;
    }

    h1 {
        font-size: 2em;
    }

    .container {
        width: 95%;
        padding: 15px;
    }

    th, td {
        font-size: 1.2em; /* Slightly smaller text for table cells */
    }
}


/* Mobile screens */
@media screen and (max-width: 480px) 
{
    body {
        font-size: 14px;
    }

    h1 {
        font-size: 1.5em;
    }

    h2 {
        font-size: 1.3em;
    }

    h3 {
        font-size: 1.1em;
    }

    .container {
        width: 100%;
        padding: 10px;
    }

    th, td {
        font-size: 1em;
        padding: 8px;
    }
}


.table-container 
{
    overflow-x: auto;
    max-width: 100%;
}




/* Headers */
h1, h2, h3, h4, h5, h6 {
    color: #000;
    margin-top: 1em;
    margin-bottom: 0.5em;
    line-height: 1.2;
}

h1 {
    font-size: 2.5em;
    text-align: center;
    text-decoration: underline;
}

h2 {
    font-size: 2em;
    text-align: center;
}

h3 {
    font-size: 1.75em;
    text-align: center;
}



/* Tables */
table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1.5em;
}

table, th, td {
    border: 1px solid #ddd;
}

th, td {

    padding: 10px;
    text-align: center;
    font-size: 1.8em;
}

th {
    background-color: #f4f4f4;
    font-size: 1.8em;
    font-weight: bold;
}

/* Emblem Images */
.center-image {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 0; /* Ensures there's no padding */
    margin: 0; /* Removes any default margin */
}

img.centered-image {
    display: block;
    margin: 0 auto;
}


* {
  box-sizing: border-box;
}

.column {
    float: left; 
    width: 50%; 
    padding: 5px; 
    display: flex; 
    justify-content: center; /* Centers the images horizontally */ 
    align-items: center; /* Centers the images vertically */ 
    height: 75%; /* Ensures the flexbox takes the full height */
}

.Thirdcolumn {
    float: left; 
    width: 33.3%; 
    padding: 5px; 
    display: flex; 
    justify-content: center; /* Centers the images horizontally */ 
    align-items: center; /* Centers the images vertically */ 
    height: 75%; /* Ensures the flexbox takes the full height */
}


/* Clearfix (clear floats) */
.row::after {
    content: ""; 
    clear: both; 
    display: table;
}

:root { --sidebar-bg-color: {{ page.backgroundcolor }}; }


/* Code */
pre, code {
    background-color: #f5f5f5;
    border: 1px solid #ddd;
    padding: 5px;
    font-family: 'Courier New', monospace;
    overflow-x: auto;
}

pre {
    padding: 10px;
}

/* Links */
a {
    /**color: #007acc;**/
    color: #000;
    text-decoration: none;
    font-size: 1em;
}

a:hover {
    text-decoration: underline;
    color: #333;
}

/* Blockquote */
blockquote 
{
    font-size: 1em;
    margin: 1.5em 10px;
    padding: 10px;
    border-left: 5px solid #ccc;
    background-color: #f9f9f9;
}

blockquote p 
{
    margin: 0;
    font-style: italic;
}

/* Images */
img {
    max-width: 100%;
    height: auto;
}

/* Responsive Design */
@media screen and (max-width: 768px) {
    .container {
        width: 100%;
        padding: 10px;
        font-size: 14px;
    }
}

/* Styles for mobile devices */
@media (max-width: 480px) {
    body {
        font-size: 12px;
    }
}


.evocation {
    font-size: 2em;
  text-align: center; /* Centers the text horizontally */
  display: flex;
  justify-content: center; /* Centers the content horizontally */
 
}

details 
{
  padding: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
  margin-bottom: 10px;
}

summary 
{
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
}

details[open] summary {
  color: #555;
}


.white-text {
    color: white;
}

.custom-heading-1 { font-size: 3em; font-weight: bold; color: #333;  text-align: center;}

.custom-heading-2 { font-size: 2em; font-weight: bold; color: #333;  text-align: center;}



    </style>



</head>
<body>

    <div class="container" style="background-color: {{page.backgroundcolor}}">
        <div class="custom-heading-1">{{ page.subtitle }}</div>
        <div class="custom-heading-2">Author: {{ page.author }}</div>
        <hr>

        <!-- Main Content of the Post -->        
        <div class="post-content">
            {{ content }}
        </div>
    </div>
</body>
</html>
