<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} - {{ site.title}}</title>
    <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/img/logo.ico">

    <style>

        body 
        {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }

        .centeredlink
        {
            display: block; /* Makes the link a block element */
            text-align: center; /* Centers the text inside the link */
            margin: 0 auto; /* Centers the link itself */
            font-size: 2em;
            padding: 10px 20px;
        }

        h1 
        {
            font-size: 2.5em;
            text-align: center;
            margin: 20px 0;
        }

        #scrollToTopBtn {
            display: none; /* Hidden by default */
            position: fixed; /* Fixed/sticky position */
            bottom: 20px; /* Place the button at the bottom of the page */
            right: 30px; /* Place the button 30px from the right */
            z-index: 99; /* Make sure it does not overlap */
            border: none; /* Remove borders */
            outline: none; /* Remove outline */
            background-color: black;/* Set a background color */
            color: white; /* Text color */
            cursor: pointer; /* Add a mouse pointer on hover */
            padding: 15px; /* Some padding */
            border-radius: 10px; /* Rounded corners */
            font-size: 18px; /* Increase font size */
        }

        #scrollToTopBtn:hover {
            background-color: #555; /* Add a dark-grey background on hover */
        }



        /* Burger Menu Button */
#burgerMenu {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 101;
    font-size: 24px;
    background-color: transparent;
    border: none;
    color: #333;
    cursor: pointer;
}

/* Sidebar */
#tocSidebar {
    position: fixed;
    top: 0;
    left: -250px; /* Hidden off-screen initially */
    width: 250px;
    height: 100%;
    background-color: var(--sidebar-bg-color, #f9f9f9);
    border-right: 1px solid #ddd;
    padding: 15px;
    box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    z-index: 100;
    transition: left 0.3s ease; /* Slide-in animation */
}

/* Sidebar Heading */
#tocSidebar h3 {
    margin-top: 0;
    font-size: 1.2em;
}

/* TOC List Styles */
#tocSidebar ul {
    list-style-type: none;
    padding: 0;
}

#tocSidebar li {
    margin: 5px 0;
}

#tocSidebar a {
    text-decoration: none;
    color: black;
}

#tocSidebar a:hover {
    text-decoration: underline;
    color: white;
}

/* Sidebar active class to show */
#tocSidebar.active {
    left: 0; /* Moves sidebar into view */
}



/* Adjustments for smaller screens */
@media screen and (max-width: 768px) {
    #tocSidebar {
        display: none; /* Hide the sidebar on small screens */
    }
}

        .container 
        {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        @media screen and (max-width: 768px) 
        {
        .container 
        {
            width: 100%;
            padding: 10px;
        }
}



        @media screen and (max-width: 768px) 
        {
            h1 {
                font-size: 1.8em;
            }

            .centeredlink {
                font-size: 1.5em;
            }

            #scrollToTopBtn {
                padding: 10px;
                font-size: 14px;
                right: 20px;
                bottom: 10px;
            }
        }

        
    </style>


    <script>


    </script>

</head>
<body>

    <!-- Burger Menu Button -->
    <button id="burgerMenu" onclick="toggleSidebar()">☰</button>

    <!-- Sidebar for Table of Contents -->
    <div id="tocSidebar">
        <h3>Table of Contents</h3>
        <ul id="tocContent">
            {{ content | toc_only }}
        </ul>
    </div>


    <h1>  <a href = "/blog/" class="centeredlink"> {{ site.title }} </a> </h1>
    
    {{ content }}

    <button id="scrollToTopBtn" title="Go to top">Top</button>

    <script>
        // Get the button
        let mybutton = document.getElementById("scrollToTopBtn");

        // When the user scrolls down 20px from the top of the document, show the button
        window.onscroll = function() {scrollFunction()};

        function scrollFunction() 
        {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) 
            {
                mybutton.style.display = "block";
            } 
            else 
            {
                mybutton.style.display = "none";
            }
        }

        // When the user clicks on the button, scroll to the top of the document
        function topFunction() 
        {
            document.body.scrollTop = 0; // For Safari
            document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE, and Opera
        }

        mybutton.addEventListener("click", topFunction);



        function toggleSidebar() 
        {
    
            const tocSidebar = document.getElementById("tocSidebar");
            const postToc = document.getElementById("post-toc");
    
            // Copy TOC content to sidebar if it's not already present
            if (tocSidebar.classList.contains("active") === false && postToc) {
                document.getElementById("tocContent").innerHTML = postToc.innerHTML;
            }
    
            tocSidebar.classList.toggle("active");
        }
    </script>



</body>
</html>
